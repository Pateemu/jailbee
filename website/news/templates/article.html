{% extends "base.html" %}
{% set description = post.summary %}
{% block content %}
<article class="news-article">
  <a class="news-back" href="/news/">← All news</a>
  {% if post.image %}<img class="news-feature" src="{{ post.image }}" alt="{{ post.image_alt }}" />{% endif %}
  <header class="news-article__header">
    <time datetime="{{ post.date.isoformat() }}"><a href="/news/{{ post.date.strftime('%Y') }}/">{{ post.date.strftime('%Y') }}</a>-<a href="/news/{{ post.date.strftime('%Y/%m') }}/">{{ post.date.strftime('%m') }}</a>-<a href="/news/{{ post.date.strftime('%Y/%m/%d') }}/">{{ post.date.strftime('%d') }}</a></time>
    <h1>{{ post.title }}</h1>
    <p class="news-summary">{{ post.summary }}</p>
  </header>
  <div class="news-article__body">{{ body_html | safe }}</div>
</article>
{% endblock %}
